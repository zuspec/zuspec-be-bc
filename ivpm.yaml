package:
    name: zuspec-be-bc
    version: 0.0.1

    dep-sets:
    - name: default-dev
      uses: default
      deps:
      - name: pytest
        src: pypi

    # What pyproject.toml declares, so CI tests what ships: the solve path
    # needs dv-solve (its PyPI wheel carries the native library), and
    # format/emit_c.py reads rt-core's ABI.
    #
    # rt-core and rt-eng come from git, as ir-core and the solver do: they
    # move in lockstep with this repo's image format. rt-core's zbc_format.h
    # is generated from format/spec.py (tests/unit/format/test_regen.py
    # holds them equal), and the C engine reads that format. A PyPI release
    # of either lags main, so testing against it fails on every format
    # change (CI was red from 2026-11-20 against rt-core 0.1.0).
    - name: default
      deps:
      - name: zuspec-ir-core
        url: https://github.com/zuspec/zuspec-ir-core.git
      - name: zuspec-solver
        url: https://github.com/zuspec/zuspec-solver.git
      - name: dv-solve
        src: pypi
      - name: zuspec-rt-core
        url: https://github.com/zuspec/zuspec-rt-core.git
      - name: zuspec-rt-eng
        url: https://github.com/zuspec/zuspec-rt-eng.git
